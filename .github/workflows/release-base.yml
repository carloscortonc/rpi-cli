name: release-base
on:
  workflow_call:
    inputs:
      dry_run:
        required: true
        type: boolean

jobs:
  release-base:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Release Preview
        if: ${{ inputs.dry_run == true }}
        id: release-preview
        run: unset GITHUB_ACTIONS && npx semantic-release --dry-run --no-ci --branches '${HEAD_REF}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Release summary
        if: ${{ inputs.dry_run == true }}
        run: |
          {
            echo "### 📦 Semantic Release Summary"
            echo "- Published: **${{ steps.release-preview.outputs.new-release-published }}**"
            echo "- Version: **${{ steps.release-preview.outputs.new-release-version }}**"
            echo "- Tag: **${{ steps.release-preview.outputs.new-release-git-tag }}**"
          } >> $GITHUB_STEP_SUMMARY

      - name: Semantic Release
        if: ${{ inputs.dry_run == false }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
