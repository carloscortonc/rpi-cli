name: release-base
on:
  workflow_call:
    inputs:
      dry_run:
        required: true
        type: boolean

jobs:
  release-base:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Semantic Release
        id: semantic-release
        run: npx semantic-release --dry-run=$DRY_RUN
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release summary
        run: |
          {
            echo "### 📦 Semantic Release Summary"
            echo "- Published: **${{ steps.semantic-release.outputs.new-release-published }}**"
            echo "- Version: **${{ steps.semantic-release.outputs.new-release-version }}**"
            echo "- Tag: **${{ steps.semantic-release.outputs.new-release-git-tag }}**"
          } >> $GITHUB_STEP_SUMMARY
